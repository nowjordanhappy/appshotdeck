name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

# A newer push to the same branch/PR makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # tsc -b + vite build: catches type errors too
      - run: npm run build
      # Lint is left out until the 7 existing eslint errors on main are fixed
      # No artifacts are uploaded; if that changes, set retention-days (Actions storage is the tight budget)
